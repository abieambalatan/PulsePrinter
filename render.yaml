databases:
  - name: printpulse-db
    databaseName: printpulse
    user: printpulse
    region: singapore
    plan: 0.1c-256mb
    ipAllowList: []

services:
  - type: web
    name: printpulse
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build && cp -r dist frontend-dist && python -m pip install -r backend/requirements.txt && cd backend && python manage.py collectstatic --noinput
    preDeployCommand: cd backend && python manage.py migrate --noinput
    startCommand: cd backend && gunicorn printpulse_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: printpulse-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "false"
