databases:
  - name: printpulse-db
    databaseName: printpulse
    user: printpulse
    region: singapore
    plan: free
    ipAllowList: []

services:
  - type: web
    name: printpulse
    runtime: python
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build && cp -r dist frontend-dist && python -m pip install -r backend/requirements.txt && cd backend && python manage.py collectstatic --noinput
    startCommand: cd backend && python manage.py migrate --noinput && python manage.py bootstrap_admin && gunicorn printpulse_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --access-logfile -
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: printpulse-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "false"
      - key: PRINTPULSE_INITIAL_ADMIN_USERNAME
        value: admin
      - key: PRINTPULSE_INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: PRINTPULSE_AGENT_TOKEN
        value: ""
      - key: PRINTPULSE_AGENT_TOKEN_V2
        generateValue: true
